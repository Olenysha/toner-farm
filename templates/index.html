{% extends "base.html" %}
{% block title %}Карта — Тонер-фарм{% endblock %}
{% block content %}
<h1>Карта этажа</h1>
<p id="mode-hint" style="display:none" class="card">
    Режим выбора принтера: нажмите на <b>подсвеченный</b> совместимый принтер.
    <button class="btn btn-secondary btn-sm" onclick="location.href='/'">Отмена</button>
</p>
<div class="map-wrap" id="map-wrap">
    <div class="map-canvas" id="map-canvas">
        <img id="floor-img" src="{{ url_for('static', filename='floor_plan.png') }}" alt="План этажа">
    </div>
    <div class="floor-menu floor-menu-left" id="ent-menu">
        <button class="floor-btn" id="ent-btn" type="button">Предприятие ▾</button>
        <div class="floor-panel floor-panel-left" id="ent-panel"></div>
    </div>
    <div class="floor-menu" id="floor-menu">
        <button class="floor-btn" id="floor-btn" type="button">Этаж ▾</button>
        <div class="floor-panel" id="floor-panel"></div>
    </div>
    <div class="map-tooltip" id="map-tooltip"></div>
</div>
<p style="color:var(--muted);font-size:14px">
    <span class="dot dot-green"></span>тонер в норме
    <span class="dot dot-yellow" style="margin-left:10px"></span>тонер 2–5%
    <span class="dot dot-red" style="margin-left:10px"></span>тонер ≤ 1% / пустой слот
    <span class="dot dot-grey" style="margin-left:10px"></span>нет данных
    <span id="snmp-stamp" style="margin-left:10px"></span>
</p>
<div class="card" id="size-panel" style="display:none">
    <label for="icon-size">Размер иконок: <span id="icon-size-val"></span>px</label>
    <input type="range" id="icon-size" min="20" max="80" step="2">
    <label for="label-size">Размер надписей: <span id="label-size-val"></span>px</label>
    <input type="range" id="label-size" min="8" max="24" step="1">
</div>
<button class="btn btn-secondary btn-sm" id="btn-sizes" style="margin-bottom:16px">⚙ Размеры иконок</button>
{% endblock %}

{% block scripts %}
<script>
const params = new URLSearchParams(location.search);
const selectMode = params.get('mode') === 'select';
const selectTonerId = params.get('toner_id');
let tonerInfo = null;

if (selectMode) {
    document.getElementById('mode-hint').style.display = 'block';
}

// ---------- предприятия и этажи ----------
let enterprises = [];
let floors = [];
let currentEntId = Number(localStorage.getItem('enterpriseId')) || null;
let currentFloorId = Number(localStorage.getItem('floorId')) || null;

async function loadEnterprises() {
    enterprises = await api('/api/enterprises').catch(() => []);
    if (!enterprises.length) return;
    if (!currentEntId || !enterprises.some(e => e.id === currentEntId)) {
        currentEntId = enterprises[0].id;
    }
    localStorage.setItem('enterpriseId', currentEntId);
    renderEntMenu();
}

function renderEntMenu() {
    const cur = enterprises.find(e => e.id === currentEntId);
    document.getElementById('ent-btn').textContent = '🏭 ' + (cur ? cur.name : 'Предприятие') + ' ▾';
    // синхронизируем глобальный селектор в шапке
    const navSel = document.getElementById('ent-select');
    if (navSel && currentEntId) navSel.value = currentEntId;
    const panel = document.getElementById('ent-panel');
    panel.innerHTML = '';
    enterprises.forEach(e => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = e.name;
        if (e.id === currentEntId) b.classList.add('active');
        b.onclick = async () => {
            currentEntId = e.id;
            localStorage.setItem('enterpriseId', e.id);
            currentFloorId = null;  // у нового предприятия свои этажи
            renderEntMenu();
            togglePanel('ent-panel', false);
            await loadFloors();
            loadFloor();
        };
        panel.appendChild(b);
    });
}

async function loadFloors() {
    floors = await api('/api/floor_plans' + (currentEntId ? '?enterprise_id=' + currentEntId : '')).catch(() => []);
    if (!floors.length) {
        currentFloorId = null;
        renderFloorMenu();
        renderIcons([]);
        return;
    }
    if (!currentFloorId || !floors.some(f => f.id === currentFloorId)) {
        currentFloorId = floors[0].id;
    }
    localStorage.setItem('floorId', currentFloorId);
    renderFloorMenu();
}

function renderFloorMenu() {
    const cur = floors.find(f => f.id === currentFloorId);
    document.getElementById('floor-btn').textContent = '🏢 ' + (cur ? cur.name : 'Этаж') + ' ▾';
    const panel = document.getElementById('floor-panel');
    panel.innerHTML = '';
    floors.forEach(f => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = f.name;
        if (f.id === currentFloorId) b.classList.add('active');
        b.onclick = () => {
            currentFloorId = f.id;
            localStorage.setItem('floorId', f.id);
            renderFloorMenu();
            togglePanel('floor-panel', false);
            loadFloor();
        };
        panel.appendChild(b);
    });
}

function togglePanel(id, force) {
    const panel = document.getElementById(id);
    const open = force !== undefined ? force : !panel.classList.contains('open');
    panel.classList.toggle('open', open);
    if (open && id === 'ent-panel') togglePanel('floor-panel', false);
    if (open && id === 'floor-panel') togglePanel('ent-panel', false);
}

document.getElementById('ent-btn').onclick = () => togglePanel('ent-panel');
document.getElementById('floor-btn').onclick = () => togglePanel('floor-panel');
// не даём жестам карты (pan/zoom) перехватывать нажатия на меню
document.getElementById('ent-menu').addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('floor-menu').addEventListener('pointerdown', e => e.stopPropagation());

async function loadFloor() {
    if (!currentFloorId) {
        // у предприятия пока нет этажей — чистая заглушка
        document.getElementById('floor-img').src = "{{ url_for('static', filename='floor_plan.png') }}";
        renderIcons([]);
        return;
    }
    try {
        const fp = await api('/api/floor_plan?floor_id=' + currentFloorId);
        if (fp.image_url) document.getElementById('floor-img').src = fp.image_url;
    } catch (e) {}
    try {
        // SNMP-уровни для всплывающих подсказок (ключ — id принтера)
        const all = await api('/api/printers/snmp/all');
        snmpCache = {};
        all.forEach(r => snmpCache[r.printer_id] = r);
        updateSnmpStamp(all);
    } catch (e) {}
    const printers = await api('/api/printers?floor_id=' + currentFloorId);
    renderIcons(printers);
}

// ---------- когда последний раз опрашивались принтеры (SNMP) ----------
function updateSnmpStamp(all) {
    const el = document.getElementById('snmp-stamp');
    if (!all || !all.length) {
        el.textContent = 'SNMP-опрос: данных пока нет';
        return;
    }
    const latest = all.map(r => r.timestamp).sort().slice(-1)[0];
    el.textContent = 'SNMP-опрос: ' + timeAgo(latest);
}

async function load() {
    await loadEnterprises();
    await loadFloors();

    if (selectMode && selectTonerId) {
        // совместимость: модель принтера в compatible_printers + нужный слот по цвету
        const lk = await api('/api/lookup_by_id/' + selectTonerId).catch(() => null);
        tonerInfo = lk;
    }
    await loadFloor();
}

function isCompatible(p) {
    if (!tonerInfo || !tonerInfo.barcode) return false;
    const bc = tonerInfo.barcode;
    if (!bc.compatible_printers.includes(p.model)) return false;
    if (p.type === 'mono') return bc.color === 'Black';
    return true; // цветной: любой цветовой слот
}

function renderIcons(printers) {
    const canvas = document.getElementById('map-canvas');
    canvas.querySelectorAll('.printer-icon').forEach(e => e.remove());
    printers.forEach(p => {
        const el = document.createElement('div');
        el.className = 'printer-icon st-' + p.status_color;
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
        el.innerHTML = '🖨<span class="printer-label">' + p.name + '</span>';
        // подсказка с состоянием при наведении
        el.addEventListener('mouseenter', ev => showTip(p, ev));
        el.addEventListener('mousemove', moveTip);
        el.addEventListener('mouseleave', hideTip);
        el.addEventListener('pointerdown', hideTip);
        if (selectMode) {
            if (isCompatible(p)) {
                el.classList.add('compatible');
                el.onclick = () => confirmInstall(p);
            } else {
                el.classList.add('disabled');
            }
        } else {
            if (p.web_url) {
                el.title = p.name + '\nЛКМ — открыть веб-интерфейс\nПКМ — информация / замена тонера';
                el.onclick = () => window.open(p.web_url, '_blank');
                el.oncontextmenu = ev => { ev.preventDefault(); showPrinter(p); };
            } else {
                el.onclick = () => showPrinter(p);
            }
        }
        canvas.appendChild(el);
    });
}

// ---------- всплывающая подсказка при наведении ----------
let snmpCache = {};

function tipMiniBar(label, val, baseColor) {
    const pct = Math.min(100, Math.max(0, val));
    const c = pct <= 1 ? '#ef4444' : pct <= 5 ? '#eab308' : baseColor;
    return `<div class="tip-bar">
        <span class="tip-bar-label">${label}</span>
        <span class="tip-bar-track"><span style="width:${pct}%;background:${c}"></span></span>
        <span class="tip-bar-pct">${pct}%</span>
    </div>`;
}

function tipHtml(p) {
    const ru = { green: 'тонер в норме', yellow: 'тонер 2–5%', red: 'тонер ≤ 1% / пустой слот', grey: 'нет данных' };
    let html = `<b>${p.name}</b><br><span class="dot dot-${p.status_color}"></span>${ru[p.status_color] || ''}`;
    const s = snmpCache[p.id];
    if (s) {
        // мини-бары уровней
        if (s.black_level !== null && s.black_level !== undefined)
            html += tipMiniBar('K', s.black_level, '#e5e7eb');
        if (p.type === 'color') {
            if (s.cyan_level !== null && s.cyan_level !== undefined)
                html += tipMiniBar('C', s.cyan_level, '#06b6d4');
            if (s.magenta_level !== null && s.magenta_level !== undefined)
                html += tipMiniBar('M', s.magenta_level, '#d946ef');
            if (s.yellow_level !== null && s.yellow_level !== undefined)
                html += tipMiniBar('Y', s.yellow_level, '#eab308');
        }
        // барабаны (если принтер отдаёт их по SNMP)
        ((s.raw_data && s.raw_data.drums) || []).forEach(d => {
            if (d.pct === null || d.pct === undefined) return;
            const label = (d.desc || 'Drum').replace(/drum cartridge/i, 'Барабан');
            html += tipMiniBar(label, d.pct, '#9ca3af');
        });
        // алерты с расшифровкой
        if (s.alerts && s.alerts.length) {
            html += '<div class="tip-alerts">' +
                s.alerts.map(a => a).join('<br>') + '</div>';
        }
        // как давно принтер был опрошен по SNMP
        html += `<br><small>Опрошен: ${timeAgo(s.timestamp)}</small>`;
    } else if (p.ip_address) {
        html += '<br><small>SNMP: не отвечает</small>';
    }
    return html;
}

function showTip(p, ev) {
    const tip = document.getElementById('map-tooltip');
    tip.innerHTML = tipHtml(p);
    tip.style.display = 'block';
    moveTip(ev);
}

function moveTip(ev) {
    const tip = document.getElementById('map-tooltip');
    if (tip.style.display !== 'block') return;
    const pad = 14;
    let x = ev.clientX + pad, y = ev.clientY + pad;
    x = Math.min(x, window.innerWidth - tip.offsetWidth - 8);
    y = Math.min(y, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
}

function hideTip() {
    document.getElementById('map-tooltip').style.display = 'none';
}

function slotsHtml(p) {
    const rows = [['Чёрный', p.slot_bk], ['Голубой', p.slot_c],
                  ['Пурпурный', p.slot_m], ['Жёлтый', p.slot_y]];
    const need = p.type === 'color' ? 4 : 1;
    return rows.slice(0, need).map(([name, t]) => {
        const val = t ? `${t.model_name || t.ean_13}<br><small>с ${t.installed_at || '—'}</small>` : '<b style="color:var(--err)">пусто</b>';
        return `<tr><td>${name}</td><td>${val}</td></tr>`;
    }).join('');
}

// «3 минуты назад» / локальное время
function timeAgo(ts) {
    const then = new Date(String(ts).replace(' ', 'T'));
    if (isNaN(then)) return ts;
    const sec = Math.max(0, Math.round((Date.now() - then.getTime()) / 1000));
    if (sec < 60) return 'только что';
    const min = Math.round(sec / 60);
    if (min < 60) return min + ' мин. назад';
    const h = Math.round(min / 60);
    if (h < 24) return h + ' ч. назад';
    return then.toLocaleString();
}

function tonerBar(label, val, baseColor) {
    const pct = Math.min(100, Math.max(0, val));
    const color = pct <= 1 ? 'var(--err)' : pct <= 5 ? 'var(--warn)' : baseColor;
    return `
        <div style="margin:8px 0">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px">
                <span>${label}</span><span>${pct}%</span>
            </div>
            <div style="background:#e5e7eb;border-radius:4px;height:10px;overflow:hidden">
                <div style="width:${pct}%;background:${color};height:100%"></div>
            </div>
        </div>`;
}

async function showPrinter(p) {
    // подтягиваем свежие SNMP-данные (если принтер опрашивается)
    let snmp = null;
    try {
        snmp = await api('/api/printers/' + p.id + '/snmp');
    } catch (e) { /* нет SNMP-данных — покажем слоты из БД */ }

    let html = `<p>${statusDot(p.status_color)}<br>
        <b>${p.model}</b> (${p.type === 'color' ? 'цветной' : 'моно'})</p>`;
    if (p.web_url) {
        html += `<p><a href="${p.web_url}" target="_blank" class="btn btn-sm btn-secondary">🌐 Открыть веб-интерфейс</a></p>`;
    }

    if (snmp) {
        html += `<p style="font-size:12px;color:var(--muted)">Обновлено: ${timeAgo(snmp.timestamp)}</p>`;
        if (p.type === 'color') {
            const colors = [
                ['black_level', 'Чёрный', '#111827'],
                ['cyan_level', 'Голубой', '#06b6d4'],
                ['magenta_level', 'Пурпурный', '#d946ef'],
                ['yellow_level', 'Жёлтый', '#eab308'],
            ];
            colors.forEach(([key, label, color]) => {
                const val = snmp[key];
                if (val !== null && val !== undefined) html += tonerBar(label, val, color);
            });
        } else if (snmp.black_level !== null && snmp.black_level !== undefined) {
            html += tonerBar('Тонер', snmp.black_level, 'var(--ok)');
        }
        // барабаны (если принтер их отдаёт по SNMP)
        const drums = (snmp.raw_data && snmp.raw_data.drums) || [];
        drums.forEach(d => {
            if (d.pct !== null && d.pct !== undefined) html += tonerBar('Барабан: ' + d.desc, d.pct, '#6b7280');
        });
        if (snmp.page_counter) {
            html += `<p style="font-size:13px;color:var(--muted);margin-top:8px">
                Всего отпечатано: ${Number(snmp.page_counter).toLocaleString('ru-RU')} стр.</p>`;
        }
        if (snmp.alerts && snmp.alerts.length) {
            html += `<div style="margin-top:12px;padding:8px 12px;border-radius:8px;background:#fef3c7">
                <p style="font-size:13px;font-weight:600;margin:0 0 4px">⚠️ Алерты:</p>
                ${snmp.alerts.map(a => `<p style="font-size:13px;margin:2px 0">• ${a}</p>`).join('')}
            </div>`;
        }
        if (snmp.status_text) {
            const cls = snmp.status_text === 'Running' ? 'var(--ok)' :
                        snmp.status_text === 'Warning' ? 'var(--warn)' : 'var(--err)';
            html += `<p style="font-size:13px;margin-top:8px">SNMP статус: <b style="color:${cls}">${snmp.status_text}</b></p>`;
        }
    } else {
        // нет SNMP — старые слоты из БД
        html += `<table>${slotsHtml(p)}</table>`;
        if (p.ip_address) {
            html += `<p style="font-size:12px;color:var(--muted)">SNMP: принтер не отвечает (${p.ip_address})</p>`;
        }
    }

    html += `<p style="margin-top:12px"><a href="/history?printer_id=${p.id}" style="font-size:13px">История операций →</a></p>`;

    showModal(p.name, html,
        [{ label: 'Заменить тонер', cls: 'btn-ok', keepOpen: true, onClick: () => showTonerChoice(p) },
         { label: 'Закрыть', cls: 'btn-secondary' }]);
}

// ---------- замена тонера со склада (без сканера) ----------
async function showTonerChoice(p) {
    let items = [];
    try {
        items = await api('/api/printers/' + p.id + '/available_toners');
    } catch (e) { /* покажем пустой список */ }

    let html;
    if (!items.length) {
        html = `<p>На складе нет совместимых тонеров для <b>${p.model}</b>.</p>`;
    } else {
        html = `<p style="font-size:13px;color:var(--muted)">Совместимые тонеры на складе — нажмите «Установить»:</p>` +
            items.map(t => `
            <div class="stock-row">
                <div>${colorChip(t.color)} <b>${t.model_name || t.ean_13}</b><br>
                <small style="color:var(--muted)">на складе: ${t.stock_count} шт.</small></div>
                <button class="btn btn-sm btn-ok" data-tid="${t.toner_id}">Установить</button>
            </div>`).join('');
    }
    html += `<p style="margin-top:12px"><a href="/scan" style="font-size:13px">Нет нужного? Сканировать коробку →</a></p>`;

    showModal('Замена тонера — ' + p.name, html,
        [{ label: 'Назад', cls: 'btn-secondary', keepOpen: true, onClick: () => showPrinter(p) }]);

    document.querySelectorAll('#modal-body [data-tid]').forEach(b => {
        b.onclick = () => installFromStock(p, +b.dataset.tid, b);
    });
}

async function installFromStock(p, tonerId, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
        await api('/api/install', 'POST', { toner_id: tonerId, printer_id: p.id });
        showModal('Готово ✓', '<p style="font-size:18px">Тонер установлен.</p>', []);
        setTimeout(() => { closeModal(); loadFloor(); }, 1200);
    } catch (e) {
        toast(e.message, 'err');
        btn.disabled = false;
        btn.textContent = 'Установить';
    }
}

function confirmInstall(p) {
    const bc = tonerInfo.barcode;
    showModal('Подтверждение',
        `<p style="font-size:18px">Установить <b>${bc.model_name}</b> ${colorChip(bc.color)}<br>в <b>${p.name}</b>?</p>`,
        [{ label: 'Да', cls: 'btn-ok', keepOpen: true, onClick: async () => {
            try {
                const r = await api('/api/install', 'POST', {
                    toner_id: Number(selectTonerId), printer_id: p.id });
                showModal('Готово ✓', '<p style="font-size:18px">Тонер установлен.</p>', []);
                setTimeout(() => location.href = '/', 1500);
            } catch (e) { toast(e.message, 'err'); closeModal(); }
        }},
        { label: 'Нет', cls: 'btn-secondary' }]);
}

// ---------- настройка размеров иконок/надписей (localStorage) ----------
(function () {
    const canvas = document.getElementById('map-canvas');
    const iconInp = document.getElementById('icon-size');
    const labelInp = document.getElementById('label-size');
    const DEF_ICON = 44, DEF_LABEL = 11;

    function apply() {
        const icon = Number(localStorage.getItem('mapIconSize')) || DEF_ICON;
        const label = Number(localStorage.getItem('mapLabelSize')) || DEF_LABEL;
        canvas.style.setProperty('--icon-size', icon + 'px');
        canvas.style.setProperty('--label-size', label + 'px');
        iconInp.value = icon;
        labelInp.value = label;
        document.getElementById('icon-size-val').textContent = icon;
        document.getElementById('label-size-val').textContent = label;
    }
    iconInp.addEventListener('input', () => {
        localStorage.setItem('mapIconSize', iconInp.value);
        apply();
    });
    labelInp.addEventListener('input', () => {
        localStorage.setItem('mapLabelSize', labelInp.value);
        apply();
    });
    document.getElementById('btn-sizes').onclick = () => {
        const p = document.getElementById('size-panel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };
    apply();
})();

// ---------- pinch-zoom + pan (CSS transform) ----------
(function () {
    const wrap = document.getElementById('map-wrap');
    const canvas = document.getElementById('map-canvas');
    let scale = 1, tx = 0, ty = 0;
    const pointers = new Map();
    let startDist = 0, startScale = 1, startTx = 0, startTy = 0, startX = 0, startY = 0;

    function apply() {
        tx = Math.min(0, Math.max(tx, wrap.clientWidth - canvas.clientWidth * scale));
        ty = Math.min(0, Math.max(ty, wrap.clientHeight - canvas.clientHeight * scale));
        canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }
    function dist() {
        const [a, b] = [...pointers.values()];
        return Math.hypot(a.x - b.x, a.y - b.y);
    }
    wrap.addEventListener('pointerdown', e => {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        wrap.setPointerCapture(e.pointerId);
        if (pointers.size === 1) { startX = e.clientX - tx; startY = e.clientY - ty; }
        if (pointers.size === 2) { startDist = dist(); startScale = scale; startTx = tx; startTy = ty; }
    });
    wrap.addEventListener('pointermove', e => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointers.size === 2) {
            scale = Math.min(4, Math.max(1, startScale * dist() / startDist));
            apply();
        } else if (pointers.size === 1 && scale > 1) {
            tx = e.clientX - startX; ty = e.clientY - startY;
            apply();
        }
    });
    const up = e => pointers.delete(e.pointerId);
    wrap.addEventListener('pointerup', up);
    wrap.addEventListener('pointercancel', up);
})();

load();
</script>
{% endblock %}
