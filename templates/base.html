<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>{% block title %}Тонер-фарм{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="topnav">
    <span class="brand">🖨 Тонер-фарм</span>
    <a href="/" class="{{ 'active' if request.path == '/' }}">Карта</a>
    <a href="/scan" class="{{ 'active' if request.path == '/scan' }}">Скан</a>
    <a href="/history" class="{{ 'active' if request.path == '/history' }}">История</a>
    <a href="/stats" class="{{ 'active' if request.path == '/stats' }}">Статистика</a>
    <a href="/availability" class="{{ 'active' if request.path == '/availability' }}">Наличие</a>
    <a href="/admin" class="{{ 'active' if request.path == '/admin' }}">Админ</a>
</nav>
<main>
    {% block content %}{% endblock %}
</main>

<div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal-box">
        <h3 id="modal-title"></h3>
        <div id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
    </div>
</div>
<div id="toast"></div>

<script>
// Редирект HTTP → HTTPS (кроме localhost)
if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    location.replace('https://' + location.host + location.pathname + location.search);
}

// ---------- Общие хелперы: модалка, тост ----------
function showModal(title, bodyHtml, buttons) {
    // buttons: [{label, cls, onClick}] — пустой массив = только закрытие по клику на фон
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = bodyHtml;
    const actions = document.getElementById('modal-actions');
    actions.innerHTML = '';
    (buttons || []).forEach(b => {
        const el = document.createElement('button');
        el.className = 'btn ' + (b.cls || '');
        el.textContent = b.label;
        el.onclick = () => { if (b.onClick) b.onClick(); if (!b.keepOpen) closeModal(); };
        actions.appendChild(el);
    });
    document.getElementById('modal-backdrop').classList.add('open');
}
function closeModal() {
    document.getElementById('modal-backdrop').classList.remove('open');
}
document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
});

let toastTimer = null;
function toast(msg, cls) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show ' + (cls || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = '', 2500);
}

async function api(url, method, data) {
    const opts = { method: method || 'GET', headers: {} };
    if (data !== undefined) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(data);
    }
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('Ошибка ' + r.status));
    return j;
}

function colorChip(color) {
    const map = { Black: ['chip-black', 'Чёрный'], Cyan: ['chip-cyan', 'Голубой'],
                  Magenta: ['chip-magenta', 'Пурпурный'], Yellow: ['chip-yellow', 'Жёлтый'] };
    const [cls, ru] = map[color] || ['chip-black', color || '?'];
    return `<span class="chip ${cls}">${ru}</span>`;
}
function statusDot(color) {
    const ru = { green: 'в порядке', yellow: 'тонер стареет', red: 'пустой слот', grey: 'нет данных' };
    return `<span class="dot dot-${color}"></span>${ru[color] || ''}`;
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
